[project]
name = "rag-knowledge-agent"
version = "0.1.0"
description = "A local RAG knowledge-base Q&A agent powered by Ollama and ChromaDB."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "muxiao" }]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "langchain>=0.2.7",
    "langchain-core>=0.2.12",
    "langchain-community>=0.2.7",
    "langchain-ollama>=0.1.1",
    "langchain-chroma>=0.1.2",
    "chromadb>=0.5.3",
    "ollama>=0.2.1",
    "unstructured>=0.14",
    "markdown>=3.6",
    "pypdf>=4.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5.0",
]

[project.scripts]
rag-agent = "rag_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
